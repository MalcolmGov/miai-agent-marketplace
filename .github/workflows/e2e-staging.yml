name: E2E staging

# Non-blocking platform automation against Railway staging.
# Not a required check — failures surface in Actions without gating merges.
on:
  workflow_dispatch:
  schedule:
    # Daily 06:15 UTC
    - cron: "15 6 * * *"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e-staging.yml"

permissions:
  contents: read

concurrency:
  group: e2e-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: e2e-smoke (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Soft gate: report red without failing the overall required status set.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run @smoke suite against staging
        env:
          # Unset → playwright.config.ts defaults to Railway staging
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
          CI: "1"
        run: pnpm test:e2e:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-critical-path:
    name: e2e-critical-path (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    needs: e2e-smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full E2E suite (incl. sandbox chat)
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
          CI: "1"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: |
            playwright-report/
            test-results/
          retention-days: 14
