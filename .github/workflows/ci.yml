name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          # Node 22+ required for --experimental-strip-types in apps/web tests
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint web
        run: pnpm --filter @miai/web lint

      - name: Unit tests (wallet + connectors + web)
        run: pnpm test

      - name: Catalogue integrity (100×5 + ZA alias policy)
        run: pnpm catalog:integrity

      - name: Static eval suite
        run: pnpm eval:suite:static

      - name: Audit production dependencies (critical)
        run: pnpm audit --prod --audit-level=critical

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block committed secrets and key material
        run: |
          set -euo pipefail
          hits="$(git ls-files | grep -E '(^|/)\.env$|\.pem$|(^|/)id_rsa$' || true)"
          if [ -n "$hits" ]; then
            echo "Forbidden committed files (use .env.example for templates):"
            echo "$hits"
            exit 1
          fi

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
