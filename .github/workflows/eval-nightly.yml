name: Eval Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  eval-nightly:
    name: eval-nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full eval suite (mock runtime)
        run: pnpm eval:suite

  # Optional live-LLM matrix — runs only when ANTHROPIC_API_KEY is configured.
  # Does not fail the workflow (continue-on-error) so nightly mock eval stays authoritative.
  live-llm-matrix:
    name: live-llm-matrix
    runs-on: ubuntu-latest
    needs: eval-nightly
    if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Go-live 18 live-LLM matrix smoke
        env:
          MIAI_MODEL_MODE: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm smoke:live-llm:matrix

  # Opt-in live quality sample — not a CI gate; separated from MockModel pass-rate.
  # Requires ANTHROPIC_API_KEY. continue-on-error so mock nightly stays authoritative.
  eval-live-sample:
    name: eval-live-sample
    runs-on: ubuntu-latest
    needs: eval-nightly
    if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Live-LLM eval sample (non-blocking)
        env:
          MIAI_MODEL_MODE: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm eval:live -- --limit=6

      - name: Upload live-eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-live-report
          path: docs/reports/eval-live-*.md
          if-no-files-found: ignore
