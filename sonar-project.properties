# SonarCloud analysis scope (read by Automatic Analysis).
#
# Duplicate-detection exclusions: these paths are generated or are data artifacts, not
# hand-written source, so copy-paste detection on them is noise. generated-presets.ts is emitted
# by scripts/generate-presets.mjs (every agent's preset block necessarily resembles the others);
# data/catalog/*.agent.json are bundled agent packages with an inherently repetitive shape.
sonar.cpd.exclusions=packages/presets/src/generated-presets.ts,data/catalog/**
