# SonarCloud analysis configuration.
#
# Exclude generated code, code-scaffolding generators, and i18n translation
# dictionaries from DUPLICATION detection only. Their repetition is structural —
# generated output and identical translation keys across locales — not a
# maintainability smell. All other rules (bugs, vulnerabilities, code smells)
# still apply to these files; this only stops them from skewing the
# "Duplications on New Code" quality gate for hand-written application code.
sonar.cpd.exclusions=packages/presets/src/generated-presets.ts,scripts/scaffold-*.mjs,apps/web/src/lib/i18n/*.ts,**/apps/web/src/lib/i18n/**,**/i18n/**,apps/web/src/lib/connectors-catalog.ts,**/*.test.mjs,**/*.test.ts,**/test/**

# Ignore S8786 ("super-linear regex backtracking") on the Telegram Markdown->HTML
# converter only. SonarCloud's static heuristic over-flags its patterns (greedy
# negated character classes + a tempered token for fenced code), but they are
# provably linear — a 100,000-char pathological input runs in <0.5ms (verified in
# PR #89). This is a scoped false-positive suppression, not a blanket disable.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.e1.resourceKey=apps/web/src/lib/consumer-telegram.ts
