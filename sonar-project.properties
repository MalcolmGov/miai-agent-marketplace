# SonarCloud analysis configuration.
#
# Exclude generated code, code-scaffolding generators, and i18n translation
# dictionaries from DUPLICATION detection only. Their repetition is structural —
# generated output and identical translation keys across locales — not a
# maintainability smell. All other rules (bugs, vulnerabilities, code smells)
# still apply to these files; this only stops them from skewing the
# "Duplications on New Code" quality gate for hand-written application code.
sonar.cpd.exclusions=packages/presets/src/generated-presets.ts,scripts/scaffold-*.mjs,apps/web/src/lib/i18n/*.ts
